<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simmer — email confirmed</title>
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: #fdf1ea; color: #2c2320;
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 24px;
  }
  @media (prefers-color-scheme: dark) {
    body { background: #1a1512; color: #f3e7e0; }
    .card { background: #241d19 !important; }
  }
  .card {
    background: #fff; border-radius: 20px; padding: 40px 32px; max-width: 380px;
    text-align: center; box-shadow: 0 12px 40px rgba(0,0,0,.08);
  }
  h1 { margin: 0 0 8px; font-size: 28px; color: #e2542a; }
  p { margin: 0 0 24px; opacity: .8; }
  a.btn {
    display: inline-block; background: #e2542a; color: #fff; text-decoration: none;
    padding: 14px 28px; border-radius: 999px; font-weight: 600;
  }
  .hint { margin-top: 20px; font-size: 13px; opacity: .6; }
</style>
</head>
<body>
  <div class="card">
    <h1>You're in</h1>
    <p>Your email is confirmed. Head back to Simmer and sign in.</p>
    <a class="btn" href="simmer://auth/confirmed">Open Simmer</a>
    <div class="hint">If nothing happens, just reopen the app yourself — you're confirmed either way.</div>
  </div>
  <script>
    // On a phone this lands straight in the app. On a desktop the scheme is
    // unknown and nothing happens, which is why the page says something useful
    // on its own rather than relying on the bounce.
    if (/iPhone|iPad|Android/i.test(navigator.userAgent)) {
      setTimeout(function () { location.href = "simmer://auth/confirmed"; }, 400);
    }
  </script>
</body>
</html>
